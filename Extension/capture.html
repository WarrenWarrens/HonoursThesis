<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Capture</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      position: relative;
    }

    video {
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      background: black;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 18px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    #overlay-container {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 10px;
      min-width: 180px;
      max-width: 300px;
      display: none;
      cursor: grab;
      z-index: 9999;
    }

    #overlay-header {
      font-weight: bold;
      margin-bottom: 5px;
      cursor: grab;
    }

    #overlay-content {
      font-size: 14px;
      white-space: normal;
      word-wrap: break-word;
    }

    #notify-popup {
      display: none;
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: #333;
      color: rgba(255,246,246,0.79);
      padding: 10px;
      border-radius: 8px;
      z-index: 10000;
    }

    /* Styles for positioned notification markers */
    .positioned-marker {
      position: fixed;
      width: 30px;
      height: 30px;
      border: 4px solid #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 9998;
      opacity: 0;
      transition: all 0.5s ease-out;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 40px currentColor;
    }

    .positioned-marker.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .positioned-marker::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse 1.5s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.7;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 1;
      }
    }

    .marker-label {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      white-space: nowrap;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .marker-label::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
<h2>Firefox Screen Capture</h2>
<video id="preview" autoplay playsinline muted></video><br>
<button id="start">Start Capture</button>
<button id="stop" disabled>Stop Capture</button>

<div id="notify-popup">
  Viewer sent a notification!
</div>

<div id="overlay-container">
  <div id="overlay-header">Messages (drag me)</div>
  <div id="overlay-content"></div>
</div>

<script src="capture.js"></script>
</body>
</html>
