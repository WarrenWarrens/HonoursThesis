<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Capture</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    video {
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      background: black;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 18px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    #overlay-container {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      border-radius: 10px;
      min-width: 180px;
      max-width: 300px;
      display: none;
      cursor: grab;
      z-index: 9999;
    }

    #overlay-header {
      font-weight: bold;
      margin-bottom: 5px;
      cursor: grab;
    }

    #overlay-content {
      font-size: 14px;
      white-space: normal;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
<h2>Firefox Screen Capture</h2>
<video id="preview" autoplay playsinline muted></video><br>
<button id="start">Start Capture</button>
<button id="stop" disabled>Stop Capture</button>
<div id="notify-popup" style="display:none;position:fixed;bottom:10px;right:10px;background:#333;color:rgba(255,246,246,0.79);padding:10px;border-radius:8px;">
  Viewer sent a notification!
</div>

<div id="overlay-container">
  <div id="overlay-header"> Messages (drag me)</div>
  <div id="overlay-content"></div>
</div>


<script src="capture.js"></script>
</body>
</html>
