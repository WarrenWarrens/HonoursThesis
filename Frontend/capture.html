<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Capture</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    video {
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      background: black;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 18px;
      background: #0078ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
  </style>
</head>
<body>
<h2>Firefox Screen Capture</h2>
<video id="preview" autoplay playsinline muted></video><br>
<button id="start">Start Capture</button>
<button id="stop" disabled>Stop Capture</button>
<div id="notify-popup" style="display:none;position:fixed;bottom:10px;right:10px;background:#333;color:rgba(255,246,246,0.79);padding:10px;border-radius:8px;">
  Viewer sent a notification!
</div>

<script src="capture.js"></script>
</body>
</html>
