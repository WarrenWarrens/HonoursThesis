<!DOCTYPE html>
<html lang="en">
<head>
  <title>Screen Share</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      width: 400px;
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    h2 {
      margin: 5px 0;
    }

    video#preview {
      width: 100%;
      height: auto;
      max-height: 200px;
      background: black;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<h2>Screen Share Preview</h2>
<video id="preview" autoplay playsinline></video>
<button id="startCapture">Start Capture</button>
</body>
<script src="popup.js"></script>
</html>
