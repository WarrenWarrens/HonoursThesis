<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Viewer</title>
	<link rel="stylesheet" href="src/style.css">
</head>
<body>

<div id="joinForm">
	<h2>Enter Stream Code</h2>
	<input id="codeInput" maxlength="4" placeholder="ABCD" />
	<button id="joinBtn">Join</button>
	<p id="error"></p>
</div>

<div id="streamContainer">
	<div class="video-container">
		<video id="remoteVideo" autoplay playsinline></video>
	</div>

	<div class="button-panel">
		<button class="control-btn" id="redBtn" data-color="red">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M12 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm8-4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM4 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm16 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM4 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm16 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM4 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
			</svg>
		</button>
		<button class="control-btn" id="blueBtn" data-color="blue">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<circle cx="6" cy="12" r="2"/>
				<circle cx="12" cy="12" r="2"/>
				<circle cx="18" cy="12" r="2"/>
			</svg>
		</button>
		<button class="control-btn" id="greenBtn" data-color="green">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
			</svg>
		</button>
		<button class="control-btn notify" id="notifyBtn">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
			</svg>
		</button>
	</div>
</div>

<script type="module" src="src/viewer.js"></script>
</body>
</html>
