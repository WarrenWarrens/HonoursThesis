<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Viewer</title>
	<style>
		body {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #f0f0f0;
			height: 100vh;
			margin: 0;
			font-family: sans-serif;
		}
		video {
			width: 90%;
			max-width: 900px;
			background: black;
			border-radius: 8px;
			display: none;
		}
		#joinForm {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}
		input {
			font-size: 1.5rem;
			text-align: center;
			letter-spacing: 0.3rem;
			padding: 5px 10px;
			width: 120px;
		}
	</style>
</head>
<body>
<div id="joinForm">
	<h2>Enter Stream Code</h2>
	<input id="codeInput" maxlength="4" placeholder="ABCD" />
	<button id="joinBtn">Join</button>
	<p id="error" style="color: red;"></p>
</div>

<video id="remoteVideo" autoplay playsinline></video>
<script type ="module" src="src/viewer.js"></script>
</body>
</html>
