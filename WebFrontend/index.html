<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Viewer</title>
	<link rel="stylesheet" href="src/style.css">
</head>
<body>

<div id="joinForm">
	<h2>Enter Stream Code</h2>
	<input id="codeInput" maxlength="4" placeholder="ABCD" />
	<button id="joinBtn">Join</button>
	<p id="error"></p>
</div>

<div id="streamContainer">
	<div class="video-container">
		<video id="remoteVideo" autoplay playsinline></video>
	</div>

	<div class="button-panel">
		<!-- Red - Bug -->
		<button class="control-btn" id="redBtn">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C13 5.06 12.5 5 12 5s-1 .06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81C7.79 19.79 9.8 21 12 21s4.21-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/>
			</svg>
		</button>
		<!-- Blue - Speech Bubble (shows text input popup) -->
		<button class="control-btn" id="blueBtn">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
			</svg>
		</button>
		<!-- Yellow - Question Mark -->
		<button class="control-btn" id="yellowBtn">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
			</svg>
		</button>
		<!-- Green - Checkmark -->
		<button class="control-btn" id="greenBtn">
			<svg viewBox="0 0 24 24" fill="currentColor">
				<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
			</svg>
		</button>
	</div>
</div>

<!-- Blue marker text popup -->
<div id="bluePopup" style="display:none;">
	<div id="bluePopupBox">
		<p>Add a comment</p>
		<input id="bluePopupInput" type="text" maxlength="50" placeholder="Type here... (50 chars max)" />
		<div id="bluePopupCharCount">0 / 50</div>
		<div id="bluePopupButtons">
			<button id="bluePopupCancel">Cancel</button>
			<button id="bluePopupSend">Send</button>
		</div>
	</div>
</div>

<script type="module" src="src/viewer.js"></script>
</body>
</html>
