<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Viewer</title>
	<link rel="stylesheet" href="../WebFrontend/src/style.css" >
</head>
<body>

<div id="joinForm">
	<h2>Enter Stream Code</h2>
	<input id="codeInput" maxlength="4" placeholder="ABCD" />
	<button id="joinBtn">Join</button>
	<p id="error"></p>
</div>

<div id="streamContainer">
	<div class="instructions">
		<h3>How to Use</h3>
		<p><strong>1.</strong> Select a color from the panel on the right</p>
		<p><strong>2.</strong> Click on the video to place a colored marker</p>
		<p><strong>3.</strong> The broadcaster will see your marker in real-time!</p>
	</div>

	<div class="viewer-content">
		<div class="video-container">
			<video id="remoteVideo" autoplay playsinline></video>
		</div>

		<div class="button-panel">
			<h4>Marker Colors</h4>
			<button class="color-btn" id="redBtn" title="Red Marker"></button>
			<button class="color-btn" id="blueBtn" title="Blue Marker"></button>
			<button class="color-btn" id="greenBtn" title="Green Marker"></button>
			<div class="divider"></div>
			<button id="notifyBtn">Send<br>Notification</button>
		</div>
	</div>
</div>

<script type="module" src="src/viewer.js"></script>
</body>
</html>
